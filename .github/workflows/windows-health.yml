name: Windows health observation

on:
  schedule:
    - cron: "43 6 * * *"

permissions:
  contents: read

concurrency:
  group: windows-health
  cancel-in-progress: false

jobs:
  observe:
    if: github.repository == 'PolySia-Systems/Platform' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/windows_health.py --notify
