name: Dependency automation

on:
  push:
  pull_request:
  schedule:
    - cron: "47 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-automation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  noop:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: echo "Registration only; this is not a dependency scan."

  generate:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14.8"
          cache: pip
          cache-dependency-path: locks/requirements-dev-py314.txt
      - if: github.event_name == 'pull_request'
        id: intent
        env:
          GH_TOKEN: ${{ github.token }}
          DEPENDENCY_PR_ACTOR: ${{ github.event.pull_request.user.login }}
          DEPENDENCY_BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
          DEPENDENCY_HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          DEPENDENCY_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          DEPENDENCY_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python scripts/dependency_locks.py lock-sync-evaluate --pr "$PR_NUMBER"
      - if: github.event_name != 'pull_request' || steps.intent.outputs.status == 'generate' || (steps.intent.outputs.status == 'noop' && fromJSON(steps.intent.outputs.payload).ecosystem == 'pip' && fromJSON(steps.intent.outputs.payload).decision != 'human_review')
        run: python -m pip install -r locks/requirements-dev-py314.txt
      - if: github.event_name != 'pull_request' || steps.intent.outputs.status == 'generate' || (steps.intent.outputs.status == 'noop' && fromJSON(steps.intent.outputs.payload).ecosystem == 'pip' && fromJSON(steps.intent.outputs.payload).decision != 'human_review')
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          DEPENDENCY_ACTOR: ${{ github.event.pull_request.user.login || github.actor }}
          CANDIDATE_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -n "$CANDIDATE_HEAD" ]; then
            python scripts/dependency_lifecycle.py generate --output "$RUNNER_TEMP/proposal" --head "$CANDIDATE_HEAD" --result "$RUNNER_TEMP/generation.json"
          else
            python scripts/dependency_lifecycle.py generate --output "$RUNNER_TEMP/proposal" --result "$RUNNER_TEMP/generation.json"
          fi
          python -c "import json,os,pathlib; r=json.loads(pathlib.Path(os.environ['RUNNER_TEMP'],'generation.json').read_text()); print('prepared='+str(r['outcome']=='proposal').lower())" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        if: steps.prepare.outputs.prepared == 'true'
        with:
          name: polysia-dependency-proposal
          path: ${{ runner.temp }}/proposal/
          retention-days: 14
          if-no-files-found: error

  scan:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14.8"
      - run: python scripts/dependency_lifecycle.py scan --output artifacts/dependency-scan.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: polysia-dependency-scan
          path: artifacts/dependency-scan.json
          retention-days: 30
          if-no-files-found: error
