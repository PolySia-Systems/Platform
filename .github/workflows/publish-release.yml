name: Publish tested release

on:
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: Successful manual full CI on main with run_windows=true
        required: true
      tag:
        description: New immutable release tag
        required: true

permissions:
  contents: write
  actions: read

concurrency:
  group: platform-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      CI_RUN_ID: ${{ inputs.ci_run_id }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify run and retain tested artifacts
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/main ]]
          [[ "$CI_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          python scripts/release_evidence.py
      - name: Verify archive and publish retained release
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from scripts.release_evidence import validate_archive
          run = json.loads(Path('run.json').read_text(encoding='utf-8'))
          validate_archive(Path('release'), run['head_sha'])
          Path('release-notes.md').write_text(
              'Tested DATA_ONLY artifact from commit `' + run['head_sha'] + '`.\n\n'
              'Source, image and archive identities are in manifest.json. '
              'Commissioning and observational acceptance require separate receipts.\n'
          )
          Path('commit.txt').write_text(run['head_sha'])
          PY
          python scripts/release_evidence.py --recheck
          gh release create "$RELEASE_TAG" release/* --target "$(cat commit.txt)" --title "$RELEASE_TAG" --notes-file release-notes.md --fail-on-no-commits
