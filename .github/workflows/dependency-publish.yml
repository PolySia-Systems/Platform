name: Dependency publication

on:
  workflow_run:
    workflows: [Dependency automation, CI]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: dependency-publication
  cancel-in-progress: false

jobs:
  report:
    if: github.event.workflow_run.name == 'Dependency automation' && (github.event.workflow_run.event == 'schedule' || github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14.8"
      - uses: actions/download-artifact@v8
        with:
          name: polysia-dependency-scan
          path: ${{ runner.temp }}/scan
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
      - env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ github.event.workflow_run.id }}
        run: python scripts/dependency_publication.py --report-scan --artifact "$RUNNER_TEMP/scan/dependency-scan.json" --run "$SOURCE_RUN"

  publish:
    if: github.event.workflow_run.name == 'Dependency automation' && github.event.workflow_run.conclusion == 'success' && (github.event.workflow_run.event == 'schedule' || github.event.workflow_run.event == 'workflow_dispatch' || github.event.workflow_run.event == 'pull_request')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14.8"
      - id: proposal
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ github.event.workflow_run.id }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN/artifacts" > "$RUNNER_TEMP/artifacts.json"
          python -c "import json,os,pathlib; a=json.loads(pathlib.Path(os.environ['RUNNER_TEMP'],'artifacts.json').read_text())['artifacts']; print('present='+str(any(x['name']=='polysia-dependency-proposal' and not x['expired'] for x in a)).lower())" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v8
        if: steps.proposal.outputs.present == 'true'
        with:
          name: polysia-dependency-proposal
          path: ${{ runner.temp }}/proposal
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Publish validated dependency proposal
        # Only trusted-main code receives this PR-only installation token.
        # The pinned official action masks it and revokes it in its post step.
        # Canonical commits, protected merges and cleanup retain GITHUB_TOKEN.
        # Native Dependabot synchronization does not use the App credential.
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ github.event.workflow_run.id }}
        if: steps.proposal.outputs.present == 'true' && github.event.workflow_run.event == 'pull_request'
        run: python scripts/dependency_publication.py --artifact "$RUNNER_TEMP/proposal" --run "$SOURCE_RUN"
      - name: Create scoped publication token
        id: pr-token
        if: steps.proposal.outputs.present == 'true' && github.event.workflow_run.event != 'pull_request'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.DEPENDENCY_PUBLICATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.DEPENDENCY_PUBLICATION_APP_PRIVATE_KEY }}
          owner: PolySia-Systems
          repositories: Platform
          permission-pull-requests: write
      - name: Publish scheduled proposal through approved App
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ github.event.workflow_run.id }}
          DEPENDENCY_PR_TOKEN: ${{ steps.pr-token.outputs.token }}
          DEPENDENCY_APP_SLUG: ${{ steps.pr-token.outputs.app-slug }}
          DEPENDENCY_APP_INSTALLATION: ${{ steps.pr-token.outputs.installation-id }}
        if: steps.proposal.outputs.present == 'true' && github.event.workflow_run.event != 'pull_request'
        run: python scripts/dependency_publication.py --artifact "$RUNNER_TEMP/proposal" --run "$SOURCE_RUN"

  merge:
    if: github.event.workflow_run.name == 'CI' && github.event.workflow_run.conclusion == 'success' && (github.event.workflow_run.event == 'workflow_dispatch' || github.event.workflow_run.event == 'pull_request')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14.8"
      - name: Merge and clean validated proposal
        id: integration
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ github.event.workflow_run.id }}
        run: python scripts/dependency_publication.py --merge-after-ci --run "$SOURCE_RUN"
      - name: Confirm dependency integration and cleanup
        if: steps.integration.outputs.integration_complete == 'true'
        run: echo "Dependency integration and guarded cleanup confirmed."
