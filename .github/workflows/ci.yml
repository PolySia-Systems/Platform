name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  TRADING_MODE: DATA_ONLY
  LIVE_TRADING_ENABLED: "false"
  POLYMARKET_LIVE_TOKEN_ALLOWLIST: ""

jobs:
  quality:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r locks/pip-py314.lock
      - run: python -m pip install --no-deps -e .
      - run: python -m compileall -q src tests
      - run: python -m ruff check .
      - run: python -m mypy src
      - run: python -m pytest -q
      - run: python -m pip check
      - run: python -m polysia.security.secret_scan
      - run: python -m build

  linux-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r locks/pip-py314.lock
      - run: python -m pip install --no-deps -e .
      - run: python -m compileall -q src tests
      - run: python -m pytest -q
      - run: python -m pip check
      - run: python -m build
      - run: python -m venv .wheel-smoke
      - shell: bash
        run: |
          .wheel-smoke/bin/python -m pip install dist/*.whl
          .wheel-smoke/bin/python -m polysia.cli --help

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build --tag polysia:ci .
      - run: docker run --rm polysia:ci health
      - shell: bash
        run: |
          mkdir -p .ci-state
          chmod 0777 .ci-state
          POLYSIA_ENV_FILE=deploy/polysia.env.example \
          POLYSIA_STATE_DIR="$PWD/.ci-state" \
          docker compose config --quiet
      - shell: bash
        run: |
          docker run --rm \
            --user 10001:10001 \
            --volume "$PWD/.ci-state:/var/lib/polysia" \
            --entrypoint python \
            polysia:ci \
            -m polysia.deployment.sqlite_backup \
            init --database /var/lib/polysia/data/polysia.sqlite3

  supply-chain:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r locks/pip-py314.lock
      - run: python -m pip_audit --strict --vulnerability-service osv
      - shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          cyclonedx-py environment --output-format JSON --output-file artifacts/sbom.json
      - uses: actions/upload-artifact@v7
        with:
          name: polysia-sbom
          path: artifacts/sbom.json
