name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      validation_scope:
        description: Validation breadth for a manual run
        required: false
        default: auto
        type: choice
        options:
          - auto
          - full
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TRADING_MODE: DATA_ONLY
  LIVE_TRADING_ENABLED: "false"
  POLYMARKET_LIVE_TOKEN_ALLOWLIST: ""

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      quality: ${{ steps.filter.outputs.quality }}
      python: ${{ steps.filter.outputs.python }}
      package: ${{ steps.filter.outputs.package }}
      container: ${{ steps.filter.outputs.container }}
      dependencies: ${{ steps.filter.outputs.dependencies }}
      windows: ${{ steps.filter.outputs.windows }}
      comprehensive: ${{ steps.filter.outputs.comprehensive }}
      browser: ${{ steps.filter.outputs.browser }}
      policy: ${{ steps.filter.outputs.policy }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: filter
        name: Classify validation scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          VALIDATION_SCOPE: ${{ inputs.validation_scope || 'auto' }}
        run: |
          python scripts/ci_policy_contract.py
          python scripts/classify_ci_changes.py --repository . --base "$BASE_SHA" --head "$GITHUB_SHA" --event "$GITHUB_EVENT_NAME" --validation-scope "$VALIDATION_SCOPE" --format github-output >> "$GITHUB_OUTPUT"

  quality:
    needs: changes
    if: needs.changes.outputs.quality == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14.8"
          cache: pip
          cache-dependency-path: locks/requirements-dev-py314.txt
      - name: Diff and path/link checks
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python scripts/check_changed_docs.py --base "$BASE_SHA" --head "$GITHUB_SHA"
      - name: Standards validation
        run: python scripts/validate_standards.py --mode full
      - name: Secret Scan
        env:
          PYTHONPATH: src
        run: python -m polysia.security.secret_scan
      - name: Install quality environment
        if: needs.changes.outputs.python == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r locks/requirements-dev-py314.txt
          python -m pip install --no-deps -e .
      - name: Compile
        if: needs.changes.outputs.python == 'true'
        run: python -m compileall -q src tests
      - uses: actions/setup-node@v7.1.0
        if: needs.changes.outputs.package == 'true'
        with:
          node-version-file: frontend/.node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Verify canonical frontend contract and reproducible assets
        if: needs.changes.outputs.package == 'true'
        run: |
          npm install --global npm@11.19.1 --ignore-scripts
          npm ci --ignore-scripts --prefix frontend
          python scripts/console_contract.py --check
          python scripts/console_fixture.py --check
          npm test --prefix frontend
          npm run build --prefix frontend
          npm run verify --prefix frontend
          git diff --exit-code -- frontend/src/contract.generated.ts frontend/tests/producer.json src/polysia/monitoring/human_console_assets
      - name: JavaScript advisory and SBOM gates
        if: needs.changes.outputs.package == 'true'
        working-directory: frontend
        run: |
          mkdir -p ../artifacts
          npm audit --audit-level=low
          npm sbom --sbom-format cyclonedx > ../artifacts/console-sbom.json
      - uses: actions/upload-artifact@v7
        if: needs.changes.outputs.package == 'true'
        with:
          name: console-sbom
          path: artifacts/console-sbom.json
          if-no-files-found: error
      - name: Ruff
        if: needs.changes.outputs.python == 'true'
        run: python -m ruff check .
      - name: Mypy
        if: needs.changes.outputs.python == 'true'
        run: python -m mypy src
      - name: Full Pytest
        if: needs.changes.outputs.python == 'true'
        run: python -m pytest -q
      - name: Environment integrity
        if: needs.changes.outputs.python == 'true'
        run: python -m pip check
      - name: Dependency lock check
        if: needs.changes.outputs.python == 'true'
        run: python scripts/dependency_locks.py check
      - name: Build package
        if: needs.changes.outputs.package == 'true'
        run: python -m build
      - name: Locked wheel smoke
        if: needs.changes.outputs.package == 'true'
        shell: bash
        run: |
          python -m venv .wheel-smoke
          .wheel-smoke/bin/python -m pip install -r locks/requirements-runtime-py314.txt
          .wheel-smoke/bin/python -m pip install --no-deps dist/*.whl
          .wheel-smoke/bin/python -c "import polysia"
          .wheel-smoke/bin/python -m polysia.cli --help
      - uses: actions/upload-artifact@v7
        if: needs.changes.outputs.package == 'true'
        with:
          name: polysia-wheel
          path: dist/*
          retention-days: 30
          if-no-files-found: error

  windows-compatibility:
    name: Windows Compatibility
    needs: changes
    if: needs.changes.outputs.windows == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14.8"
          cache: pip
          cache-dependency-path: locks/requirements-dev-py314.txt
      - name: Install compatibility environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r locks/requirements-dev-py314.txt
          python -m pip install --no-deps -e .
      - name: Compile
        run: python -m compileall -q src tests
      - name: Full Pytest
        run: python -m pytest -q --durations=25 --junitxml=artifacts/windows-pytest.xml
      - name: Environment integrity
        run: python -m pip check
      - name: Dependency lock check
        run: python scripts/dependency_locks.py check
      - name: Build package
        run: python -m build
      - name: CLI smoke
        run: python -m polysia.cli --help
      - name: Retain Windows timing
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-timing
          path: artifacts/windows-pytest.xml
          if-no-files-found: error
          retention-days: 30

  container:
    needs: changes
    if: needs.changes.outputs.container == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - run: docker build --build-arg POLYSIA_BUILD_COMMIT="$GITHUB_SHA" --tag polysia:ci .
      - run: docker run --rm polysia:ci system health
      - name: Verify offline installed Console custody
        run: docker run --rm --network none --entrypoint python polysia:ci -c 'from polysia.monitoring.console_bundle import verify_bundle; print(verify_bundle()["source"])'
      - name: Encryption runtime and round-trip smoke
        shell: bash
        run: |
          docker run --rm --network none --user 0 --tmpfs /tmp:rw,noexec,nosuid,size=8m --entrypoint python polysia:ci -c '
          import pathlib, subprocess, tempfile
          with tempfile.TemporaryDirectory() as directory:
              root = pathlib.Path(directory)
              key = root / "test-identity"
              subprocess.run(["age-keygen", "-o", str(key)], check=True, capture_output=True)
              recipient = subprocess.check_output(["age-keygen", "-y", str(key)], text=True).strip()
              source = root / "input"
              source.write_bytes(b"recovery fixture")
              subprocess.run(["age", "-r", recipient, "-o", str(root / "encrypted"), str(source)], check=True)
              result = subprocess.check_output(["age", "-d", "-i", str(key), str(root / "encrypted")])
              assert result == source.read_bytes()
          print("age encryption and independent decryption passed")'
      - shell: bash
        run: |
          mkdir -p .ci-state
          chmod 0777 .ci-state
          POLYSIA_ENV_FILE=deploy/polysia.env.example \
          POLYSIA_STATE_DIR="$PWD/.ci-state" \
          docker compose config --quiet
      - shell: bash
        run: |
          docker run --rm \
            --user 10001:10001 \
            --volume "$PWD/.ci-state:/var/lib/polysia" \
            --entrypoint python \
            polysia:ci \
            -m polysia.deployment.sqlite_backup \
            init --database /var/lib/polysia/data/polysia.sqlite3
      - name: Verify separate worker and web command ownership
        shell: bash
        run: |
          mkdir -p .ci-state/control
          docker run --rm --network none --user 0:0 --volume "$PWD/.ci-state/control:/control" --entrypoint python polysia:ci -c 'import os; os.chown("/control",10101,10102); os.chmod("/control",0o2770)'
          docker run --rm --network none --user 10101:10102 --volume "$PWD/.ci-state/control:/control" --entrypoint python polysia:ci -c 'from pathlib import Path; from polysia.storage.console_commands import ConsoleCommandStore; ConsoleCommandStore(Path("/control/commands.sqlite3")).initialize()'
          docker run --rm --network none --user 10102:10102 --volume "$PWD/.ci-state/control:/control" --entrypoint python polysia:ci -c 'from pathlib import Path; from polysia.storage.console_commands import ConsoleCommandStore; s=ConsoleCommandStore(Path("/control/commands.sqlite3")); s.initialize(); assert s.submit(subject="fixture-operator",action="stop",expected_revision=0,idempotency_key="separate-identities-test")["status"]=="REQUESTED"'
          docker run --rm --network none --user 10101:10102 --volume "$PWD/.ci-state/control:/control" --entrypoint python polysia:ci -c 'from pathlib import Path; from polysia.storage.console_commands import ConsoleCommandStore; s=ConsoleCommandStore(Path("/control/commands.sqlite3")); s.finish(1,status="APPLIED"); assert s.pending()==[]'
      - name: Verify read-only financial SQL with WAL bookkeeping
        shell: bash
        run: |
          docker run --rm --network none --user 10101:10102 --volume "$PWD/.ci-state/control:/state" --entrypoint python polysia:ci -c 'import sqlite3; c=sqlite3.connect("/state/readonly-fixture.sqlite3"); c.execute("PRAGMA journal_mode=WAL"); c.execute("CREATE TABLE evidence(value INTEGER)"); c.execute("INSERT INTO evidence VALUES(1)"); c.commit(); c.close()'
          docker run --rm --network none --user 10101:10102 --volume "$PWD/.ci-state/control:/state" --entrypoint python polysia:ci -c 'import sqlite3; c=sqlite3.connect("file:/state/readonly-fixture.sqlite3?mode=ro",uri=True); c.execute("PRAGMA query_only=ON"); assert c.execute("SELECT value FROM evidence").fetchall()==[(1,)]; denied=False
          try: c.execute("INSERT INTO evidence VALUES(2)")
          except sqlite3.OperationalError: denied=True
          assert denied; c.close()'
      - name: Retain exact tested image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-image
          cp deploy/platform_bootstrap.py release-image/platform_bootstrap.py
          cp deploy/platform_backup.py release-image/platform_backup.py
          cp deploy/platform_admin.py release-image/platform_admin.py
          docker save polysia:ci | gzip > release-image/polysia-image.tar.gz
          docker image inspect polysia:ci --format '{{.Id}}' > release-image/image-id.txt
          docker run --rm --network none --entrypoint dpkg-query polysia:ci -W age libc6 > release-image/os-packages.txt
          docker run --rm --network none --entrypoint python polysia:ci -c 'import importlib.metadata as m,json,platform; print(json.dumps({"python":platform.python_version(),"packages":{n:m.version(n) for n in ("polymarket-client","pydantic","pydantic-core","pydantic-settings","websockets")}},sort_keys=True))' > release-image/runtime-packages.json
          python scripts/release_manifest.py --image release-image/polysia-image.tar.gz --image-id-file release-image/image-id.txt --commit "$GITHUB_SHA" --output release-image/manifest.json --os-packages-file release-image/os-packages.txt --runtime-packages-file release-image/runtime-packages.json
      - uses: actions/upload-artifact@v7
        with:
          name: polysia-release-image
          path: release-image/*
          retention-days: 30
          if-no-files-found: error

  browser-acceptance:
    needs: changes
    if: needs.changes.outputs.browser == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24.22.1"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install pinned development accessibility engine
        run: npm ci --ignore-scripts --prefix frontend
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14.8"
      - run: python -m pip install -r locks/requirements-dev-py314.txt
      - run: python -m build --wheel --no-isolation
      - run: python -m pip install --no-deps dist/*.whl
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest -q tests/browser -o pythonpath=
        env:
          POLYSIA_BROWSER_TESTS: "1"
          POLYSIA_REQUIRE_WHEEL: "1"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: console-browser-evidence
          path: output/playwright/*
          if-no-files-found: error
          retention-days: 14

  supply-chain:
    needs: changes
    if: needs.changes.outputs.dependencies == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14.8"
          cache: pip
          cache-dependency-path: locks/requirements-dev-py314.txt
      - run: python -m venv "$RUNNER_TEMP/polysia-audit-venv"
      - run: |
          "$RUNNER_TEMP/polysia-audit-venv/bin/python" -m pip install --upgrade pip
      - run: |
          "$RUNNER_TEMP/polysia-audit-venv/bin/python" -m pip install -r locks/requirements-dev-py314.txt
      - run: |
          "$RUNNER_TEMP/polysia-audit-venv/bin/python" -m pip_audit --strict --vulnerability-service osv
      - name: Generate SBOM
        shell: bash
        run: |
          mkdir -p artifacts
          "$RUNNER_TEMP/polysia-audit-venv/bin/cyclonedx-py" environment --output-format JSON --output-file artifacts/sbom.json
      - name: Build compatibility wheel
        run: |
          "$RUNNER_TEMP/polysia-audit-venv/bin/python" -m build
      - name: Allowed-range compatibility smoke
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/polysia-compat-venv"
          "$RUNNER_TEMP/polysia-compat-venv/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/polysia-compat-venv/bin/python" -m pip check
          "$RUNNER_TEMP/polysia-compat-venv/bin/python" -m polysia.cli --help
      - uses: actions/upload-artifact@v7
        with:
          name: polysia-sbom
          path: artifacts/sbom.json
          retention-days: 14

  installation-acceptance:
    needs: [changes, container]
    if: needs.changes.outputs.container == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14.8"
      - uses: actions/download-artifact@v7
        with:
          name: polysia-release-image
          path: release-image
      - name: Fresh supervised installation and trusted private HTTPS
        id: private_install
        run: |
          sudo "$(command -v python)" scripts/installation_acceptance.py \
            --artifact-directory release-image --commit "$GITHUB_SHA" \
            --output "$RUNNER_TEMP/installation-receipt.json" \
            --browser-handoff "$RUNNER_TEMP/browser-fixture-handoff.json"
      - name: Retain installation acceptance
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: polysia-installation-acceptance
          path: ${{ runner.temp }}/installation-receipt.json
          if-no-files-found: warn
      - name: Prepare explicit browser and recovery fixture dependencies
        if: ${{ !cancelled() && steps.private_install.outcome == 'success' }}
        run: |
          python -m pip install -r locks/requirements-dev-py314.txt
          python -m pip install --no-deps -e .
          python -m playwright install --with-deps firefox
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libnss3-tools
      - name: Installed desktop mobile and keyboard journeys with isolated trust
        if: ${{ !cancelled() && steps.private_install.outcome == 'success' }}
        run: |
          python scripts/installed_browser_acceptance.py --handoff "$RUNNER_TEMP/browser-fixture-handoff.json" \
            --output "$RUNNER_TEMP/installed-browser-receipt.json"
      - name: Real own-domain ACME issuance renewal and recovery
        if: ${{ !cancelled() && steps.private_install.outcome == 'success' }}
        run: |
          IMAGE_ID=$(python -c 'import json,os; from pathlib import Path; print(json.loads((Path(os.environ["RUNNER_TEMP"])/"installation-receipt.json").read_text())["image_id"])')
          sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT "$(command -v python)" scripts/gateway_acme_acceptance.py \
            --image-id "$IMAGE_ID" --output "$RUNNER_TEMP/acme-receipt.json"
      - name: Retain isolated ACME acceptance
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: polysia-acme-acceptance
          path: ${{ runner.temp }}/acme-receipt.json
          if-no-files-found: warn
      - name: Real backup destination replacement and nonempty replacement recovery
        if: ${{ !cancelled() && steps.private_install.outcome == 'success' }}
        run: |
          IMAGE_ID=$(python -c 'import json,os; from pathlib import Path; print(json.loads((Path(os.environ["RUNNER_TEMP"])/"installation-receipt.json").read_text())["image_id"])')
          sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT "$(command -v python)" scripts/backup_destination_acceptance.py \
            --artifact-directory release-image --image-id "$IMAGE_ID" --commit "$GITHUB_SHA" \
            --output "$RUNNER_TEMP/backup-destination-receipt.json"
      - name: Retain browser and nonempty recovery receipts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: polysia-product-acceptance
          path: |
            ${{ runner.temp }}/installed-browser-receipt.json
            ${{ runner.temp }}/backup-destination-receipt.json
          if-no-files-found: warn

  dependency-health:
    # Independent of the scan producer. Keep this visible without turning
    # an unrelated engineering PR into a publication-permission workaround.
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14.8"
      - env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/dependency_lifecycle.py health --notify

  ci-gate:
    name: CI Gate
    needs:
      - changes
      - quality
      - windows-compatibility
      - container
      - supply-chain
      - browser-acceptance
      - installation-acceptance
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify required jobs
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          VALIDATION_SCOPE: ${{ inputs.validation_scope || 'auto' }}
        run: |
          python scripts/ci_policy_contract.py
          python scripts/classify_ci_changes.py --repository . --base "$BASE_SHA" --head "$GITHUB_SHA" --event "$GITHUB_EVENT_NAME" --validation-scope "$VALIDATION_SCOPE" --verify-gate
