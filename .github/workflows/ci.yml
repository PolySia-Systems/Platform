name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  TRADING_MODE: DATA_ONLY
  LIVE_TRADING_ENABLED: "false"
  POLYMARKET_LIVE_TOKEN_ALLOWLIST: ""

jobs:
  quality:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m compileall -q src tests
      - run: python -m ruff check .
      - run: python -m mypy src
      - run: python -m pytest -q
      - run: python -m pip check
      - run: python -m polysia.security.secret_scan
      - run: python -m build

  supply-chain:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pip_audit --strict --vulnerability-service osv
      - shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          cyclonedx-py environment --output-format JSON --output-file artifacts/sbom.json
      - uses: actions/upload-artifact@v7
        with:
          name: polysia-sbom
          path: artifacts/sbom.json
