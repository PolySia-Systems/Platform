name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      validation_scope:
        description: Validation breadth for a manual run
        required: false
        default: auto
        type: choice
        options:
          - auto
          - full
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TRADING_MODE: DATA_ONLY
  LIVE_TRADING_ENABLED: "false"
  POLYMARKET_LIVE_TOKEN_ALLOWLIST: ""

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      quality: ${{ steps.filter.outputs.quality }}
      python: ${{ steps.filter.outputs.python }}
      package: ${{ steps.filter.outputs.package }}
      container: ${{ steps.filter.outputs.container }}
      dependencies: ${{ steps.filter.outputs.dependencies }}
      windows: ${{ steps.filter.outputs.windows }}
      comprehensive: ${{ steps.filter.outputs.comprehensive }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: filter
        name: Classify validation scope
        shell: pwsh
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          VALIDATION_SCOPE: ${{ inputs.validation_scope || 'auto' }}
        run: |
          $eventName = $env:GITHUB_EVENT_NAME
          $files = @()
          if ($eventName -in @('pull_request', 'push')) {
            $base = $env:BASE_SHA
            if ([string]::IsNullOrWhiteSpace($base) -or $base -match '^0+$') {
              $base = git rev-parse "$env:GITHUB_SHA^"
              if ($LASTEXITCODE -ne 0) {
                throw "Unable to resolve a comparison base."
              }
            }
            $files = @(git diff --name-only --diff-filter=ACDMRTUXB $base $env:GITHUB_SHA)
            if ($LASTEXITCODE -ne 0) {
              throw "Unable to classify changed paths."
            }
          }

          $output = $files | python scripts/classify_ci_changes.py `
            --event $eventName `
            --validation-scope $env:VALIDATION_SCOPE `
            --format github-output
          if ($LASTEXITCODE -ne 0) {
            throw "CI change classification failed."
          }
          $output | Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8

  quality:
    needs: changes
    if: needs.changes.outputs.quality == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: locks/pip-py314.lock
      - name: Diff and path/link checks
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python scripts/check_changed_docs.py --base "$BASE_SHA" --head "$GITHUB_SHA"
      - name: Standards validation
        run: python scripts/validate_standards.py --mode full
      - name: Secret Scan
        env:
          PYTHONPATH: src
        run: python -m polysia.security.secret_scan
      - name: Install quality environment
        if: needs.changes.outputs.python == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r locks/pip-py314.lock
          python -m pip install --no-deps -e .
      - name: Compile
        if: needs.changes.outputs.python == 'true'
        run: python -m compileall -q src tests
      - name: Ruff
        if: needs.changes.outputs.python == 'true'
        run: python -m ruff check .
      - name: Mypy
        if: needs.changes.outputs.python == 'true'
        run: python -m mypy src
      - name: Full Pytest
        if: needs.changes.outputs.python == 'true'
        run: python -m pytest -q
      - name: Environment integrity
        if: needs.changes.outputs.python == 'true'
        run: python -m pip check
      - name: Build package
        if: needs.changes.outputs.package == 'true'
        run: python -m build
      - name: Locked wheel smoke
        if: needs.changes.outputs.package == 'true'
        shell: bash
        run: |
          python -m venv .wheel-smoke
          .wheel-smoke/bin/python -m pip install -r locks/pip-runtime-py314.lock
          .wheel-smoke/bin/python -m pip install --no-deps dist/*.whl
          .wheel-smoke/bin/python -c "import polysia"
          .wheel-smoke/bin/python -m polysia.cli --help

  windows-compatibility:
    name: Windows Compatibility
    needs: changes
    if: needs.changes.outputs.windows == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: locks/pip-py314.lock
      - name: Install compatibility environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r locks/pip-py314.lock
          python -m pip install --no-deps -e .
      - name: Compile
        run: python -m compileall -q src tests
      - name: Full Pytest
        run: python -m pytest -q
      - name: Environment integrity
        run: python -m pip check
      - name: Build package
        run: python -m build
      - name: CLI smoke
        run: python -m polysia.cli --help

  container:
    needs: changes
    if: needs.changes.outputs.container == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - run: docker build --tag polysia:ci .
      - run: docker run --rm polysia:ci system health
      - shell: bash
        run: |
          mkdir -p .ci-state
          chmod 0777 .ci-state
          POLYSIA_ENV_FILE=deploy/polysia.env.example \
          POLYSIA_STATE_DIR="$PWD/.ci-state" \
          docker compose config --quiet
      - shell: bash
        run: |
          docker run --rm \
            --user 10001:10001 \
            --volume "$PWD/.ci-state:/var/lib/polysia" \
            --entrypoint python \
            polysia:ci \
            -m polysia.deployment.sqlite_backup \
            init --database /var/lib/polysia/data/polysia.sqlite3

  supply-chain:
    needs: changes
    if: needs.changes.outputs.dependencies == 'true'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: locks/pip-py314.lock
      - run: python -m venv .audit-venv
      - run: .\.audit-venv\Scripts\python.exe -m pip install --upgrade pip
      - run: .\.audit-venv\Scripts\python.exe -m pip install -r locks/pip-py314.lock
      - run: .\.audit-venv\Scripts\python.exe -m pip_audit --strict --vulnerability-service osv
      - shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          .\.audit-venv\Scripts\cyclonedx-py.exe environment --output-format JSON --output-file artifacts/sbom.json
      - uses: actions/upload-artifact@v7
        with:
          name: polysia-sbom
          path: artifacts/sbom.json
          retention-days: 14

  ci-gate:
    name: CI Gate
    needs:
      - changes
      - quality
      - windows-compatibility
      - container
      - supply-chain
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CHANGES_RESULT: ${{ needs.changes.result }}
      QUALITY_REQUIRED: ${{ needs.changes.outputs.quality }}
      QUALITY_RESULT: ${{ needs.quality.result }}
      WINDOWS_REQUIRED: ${{ needs.changes.outputs.windows }}
      WINDOWS_RESULT: ${{ needs.windows-compatibility.result }}
      CONTAINER_REQUIRED: ${{ needs.changes.outputs.container }}
      CONTAINER_RESULT: ${{ needs.container.result }}
      SUPPLY_CHAIN_REQUIRED: ${{ needs.changes.outputs.dependencies }}
      SUPPLY_CHAIN_RESULT: ${{ needs.supply-chain.result }}
    steps:
      - name: Verify required jobs
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$CHANGES_RESULT" != "success" ]]; then
            echo "changes job did not succeed: $CHANGES_RESULT"
            exit 1
          fi

          check_job() {
            local name="$1"
            local required="$2"
            local result="$3"
            if [[ "$required" == "true" && "$result" != "success" ]]; then
              echo "$name was required but concluded: $result"
              exit 1
            fi
            if [[ "$required" != "true" && "$result" != "skipped" ]]; then
              echo "$name was not required but concluded: $result"
              exit 1
            fi
          }

          check_job quality "$QUALITY_REQUIRED" "$QUALITY_RESULT"
          check_job windows-compatibility "$WINDOWS_REQUIRED" "$WINDOWS_RESULT"
          check_job container "$CONTAINER_REQUIRED" "$CONTAINER_RESULT"
          check_job supply-chain "$SUPPLY_CHAIN_REQUIRED" "$SUPPLY_CHAIN_RESULT"
          echo "All required CI jobs succeeded."
