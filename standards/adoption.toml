schema_version = 1
record_id = "ADP-PLATFORM-001"
status = "active_conformant"
consumer = "PolySia-Systems/Platform"
accountable_owner = "PolySia Platform Owner"
adoption_date = "2026-08-17"
review_trigger = "2026-11-17 or earlier on a Standards, profile, Python-support, public-interface, environment-vocabulary, or consumer-boundary change"
standards_repository = "PolySia-Systems/Standards"
standards_release = "v0.1.1"
standards_commit = "921db357c07bf1d940f72cfbb662d940288132ca"
standards_release_id = 368473737
standards_release_immutable = true
profiles = ["PRF-BASE", "PRF-PYS"]
component_roots = [".", "src/polysia", "tests", "scripts"]
excluded_boundaries = [
  "PolySia-Systems/Standards",
  "PolySia-Systems/Infrastructure",
  "PolySia-Systems/Market-Data",
  "external deployments and live systems",
  "third-party and generated identifiers",
  "historical records under docs/13-ai-handoffs, docs/18-ai-handoffs, and docs/99-archive",
]
conformance_claim = "conformant_with_v0.1.1_for_selected_profiles"

[enforcement]
mode = "full"
validator = "scripts/validate_standards.py"
network_access = false

[consumer_facts]
controlled_repository = true
primary_runtime = "Python"
supported_python = ">=3.14,<3.15"
installable_project = true
reusable_library_interface = true
public_cli = true
python_serialized_models = true
external_effect_tests_by_default = false
repeatable_verification_environment = true

[consumer_fact_evidence]
installable_project = "pyproject.toml; src/polysia"
reusable_library_interface = "src/polysia/__init__.py and explicit package exports"
public_cli = "pyproject.toml [project.scripts] and src/polysia/cli.py"
python_serialized_models = "src/polysia domain models and explicit JSON boundaries"
external_effect_tests_by_default = "AGENTS.md runtime safety rules and tests"
repeatable_verification_environment = "locks/pip-py314.lock; environment.yml; CI"

[python]
distribution = "polysia"
import_root = "polysia"
source_root = "src/polysia"
test_root = "tests"
cli_entry_point = "polysia=polysia.cli:app"
canonical_metadata = "pyproject.toml"
canonical_test_command = "python -m pytest -q"
type_check_scope = "src"

[python.dependency_imports]
polymarket = "polymarket-client"
pydantic = "pydantic"
pydantic_settings = "pydantic-settings"
structlog = "structlog"
typer = "typer"

[environment]
group_applies = true
implemented_base_classes = ["development", "test", "production"]
not_implemented_base_classes = ["staging"]
additional_classes = [
  "research",
  "sandbox",
  "paper",
  "shadow",
  "limited-live",
  "disaster-recovery",
]
legacy_aliases = ["dev=development", "local=development", "prd=production", "prod=production", "qa=test", "server=production", "stage=staging", "stg=staging", "testing=test"]
alias_exit_trigger = "Remove an input alias only after verified consumers no longer require it; repository-owned values are canonical"

[[requirement_groups]]
name = "profile-framework-consumer"
outcome = "applicable"
condition = "The consumer adopts released profiles and produces an assessment."
ids = ["PRF-FRM-005", "PRF-FRM-006", "PRF-FRM-007", "PRF-FRM-010", "PRF-FRM-013", "PRF-FRM-014"]
evidence = "standards/adoption.toml; docs/00-governance/standards-adoption-v0.1.1.md"

[[requirement_groups]]
name = "profile-framework-absent-events"
outcome = "not_applicable"
condition = "No scoped refinement, unresolved profile conflict, or profile change exists."
ids = ["PRF-FRM-008", "PRF-FRM-011", "PRF-FRM-015"]
evidence = "Adoption review and profile-resolution record"

[[requirement_groups]]
name = "profile-framework-source-authority"
outcome = "source_authority"
condition = "These requirements govern the profile artifacts and Profile Owner in the immutable Standards release, not the consumer implementation."
ids = ["PRF-FRM-001", "PRF-FRM-002", "PRF-FRM-003", "PRF-FRM-004", "PRF-FRM-009", "PRF-FRM-012", "PRF-FRM-016"]
evidence = "PolySia-Systems/Standards v0.1.1 profiles"

[[requirement_groups]]
name = "base-profile-consumer"
outcome = "applicable"
condition = "Platform is a PolySia-controlled repository with durable paths, documents, and an explicit adoption."
ids = ["PRF-BASE-001", "PRF-BASE-002", "PRF-BASE-003", "PRF-BASE-004", "PRF-BASE-005", "PRF-BASE-006", "PRF-BASE-007", "PRF-BASE-008"]
evidence = "Consumer boundary, environment map, and resolved requirement groups"

[[requirement_groups]]
name = "base-profile-owner-review"
outcome = "source_authority"
condition = "The quarterly Profile review belongs to the external Profile Owner."
ids = ["PRF-BASE-009"]
evidence = "PolySia-Systems/Standards v0.1.1 PRF-BASE"

[[requirement_groups]]
name = "python-profile-consumer"
outcome = "applicable"
condition = "Platform is a maintained, installable Python project with metadata, repeatable verification, exported interfaces, and a public CLI."
ids = ["PRF-PYS-001", "PRF-PYS-002", "PRF-PYS-003", "PRF-PYS-004", "PRF-PYS-005", "PRF-PYS-006"]
evidence = "pyproject.toml; src/polysia; tests; locks; consumer facts"

[[requirement_groups]]
name = "python-profile-owner-review"
outcome = "source_authority"
condition = "The quarterly Profile review belongs to the external Profile Owner."
ids = ["PRF-PYS-007"]
evidence = "PolySia-Systems/Standards v0.1.1 PRF-PYS"

[[requirement_groups]]
name = "core-interpretation-and-assessment"
