name: polysia

services:
  monitor:
    image: polysia:${POLYSIA_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        POLYSIA_BUILD_COMMIT: ${POLYSIA_IMAGE_TAG:-unknown}
    env_file:
      - path: ${POLYSIA_ENV_FILE:-/etc/polysia/polysia.env}
        required: true
    environment:
      APP_ENV: production
      LIVE_TRADING_ENABLED: "false"
      POLYSIA_COPY_SIGNAL_ARBITER_FULL_ENABLED: "false"
      POLYMARKET_LIVE_TOKEN_ALLOWLIST: ""
      TRADING_MODE: DATA_ONLY
    entrypoint:
      - /bin/sh
      - -ec
    command:
      - |
        reconciliation_cycle=0
        while true; do
          python -m polysia.cli ops tiny-live-monitor \
            --max-cycles 1 \
            --interval-seconds 60 \
            --output-dir /var/lib/polysia/reports
          reconciliation_cycle=$$((reconciliation_cycle + 1))
          if [ "$$reconciliation_cycle" -ge \
            "$${POLYSIA_RECONCILIATION_EVERY_CYCLES:-15}" ]; then
            python -m polysia.cli ops post-live-reconciliation \
              --output-dir /var/lib/polysia/reports
            reconciliation_cycle=0
          fi
          sleep "$${POLYSIA_MONITOR_INTERVAL_SECONDS:-60}"
        done
    user: "10001:10001"
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    volumes:
      - type: bind
        source: ${POLYSIA_STATE_DIR:-/var/lib/polysia}
        target: /var/lib/polysia
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          test -w /var/lib/polysia &&
          python -m polysia.cli system health >/dev/null
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    stop_grace_period: 30s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 768m
    cpus: 1.0
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "5"

  backup:
    image: polysia:${POLYSIA_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
    profiles:
      - operations
    entrypoint:
      - python
      - -m
      - polysia.deployment.sqlite_backup
    command:
      - backup
      - --database
      - /var/lib/polysia/data/polysia.sqlite3
      - --backup-dir
      - /var/lib/polysia/backups
      - --keep
      - "${POLYSIA_BACKUP_RETENTION:-14}"
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    volumes:
      - type: bind
        source: ${POLYSIA_STATE_DIR:-/var/lib/polysia}
        target: /var/lib/polysia
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  wallet-intelligence-sync:
    image: polysia:${POLYSIA_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        POLYSIA_BUILD_COMMIT: ${POLYSIA_IMAGE_TAG:-unknown}
    profiles:
      - wallet-intelligence
    environment:
      APP_ENV: production
      LIVE_TRADING_ENABLED: "false"
      TRADING_MODE: DATA_ONLY
    command:
      - wallet-intelligence
      - ensure
      - --source
      - polycop
      - --database
      - /var/lib/polysia/data/wallet-intelligence.sqlite3
      - --backup-dir
      - /var/lib/polysia/backups/wallet-intelligence
      - --health-report
      - /var/lib/polysia/reports/wallet-intelligence/latest.json
      - --backup-keep
      - "${POLYSIA_WALLET_BACKUP_RETENTION:-14}"
      - --history-days
      - "${POLYSIA_WALLET_HISTORY_DAYS:-365}"
      - --quarantine-days
      - "${POLYSIA_WALLET_QUARANTINE_DAYS:-30}"
      - --intelligence-history-days
      - "${POLYSIA_WALLET_INTELLIGENCE_HISTORY_DAYS:-365}"
      - --fresh-hours
      - "${POLYSIA_WALLET_FRESH_HOURS:-24}"
      - --stale-hours
      - "${POLYSIA_WALLET_STALE_HOURS:-36}"
      - --lease-minutes
      - "${POLYSIA_WALLET_LEASE_MINUTES:-30}"
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    volumes:
      - type: bind
        source: ${POLYSIA_STATE_DIR:-/var/lib/polysia}/wallet-intelligence/data
        target: /var/lib/polysia/data
      - type: bind
        source: ${POLYSIA_STATE_DIR:-/var/lib/polysia}/wallet-intelligence/backups
        target: /var/lib/polysia/backups/wallet-intelligence
      - type: bind
        source: ${POLYSIA_STATE_DIR:-/var/lib/polysia}/wallet-intelligence/reports
        target: /var/lib/polysia/reports/wallet-intelligence
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 512m
    cpus: 0.5
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "5"

  wallet-intelligence-shadow:
    image: polysia:${POLYSIA_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        POLYSIA_BUILD_COMMIT: ${POLYSIA_IMAGE_TAG:-unknown}
    profiles:
      - wallet-intelligence
    environment:
      APP_ENV: production
      LIVE_TRADING_ENABLED: "false"
      TRADING_MODE: DATA_ONLY
    command:
      - wallet-intelligence
      - shadow-sync
      - --source
      - polycop
      - --database
      - /var/lib/polysia/data/wallet-intelligence.sqlite3
      - --mode
      - FORWARD
      - --lookback-minutes
      - "${POLYSIA_SHADOW_LOOKBACK_MINUTES:-15}"
      - --maximum-forward-delay-ms
      - "${POLYSIA_SHADOW_MAX_DELAY_MS:-900000}"
      - --fee-bps
      - "${POLYSIA_SHADOW_FEE_BPS:-200}"
      - --maximum-notional
      - "${POLYSIA_SHADOW_MAX_NOTIONAL:-5}"
      - --history-days
      - "${POLYSIA_SHADOW_HISTORY_DAYS:-365}"
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    volumes:
      - type: bind
        source: ${POLYSIA_STATE_DIR:-/var/lib/polysia}/wallet-intelligence/data
        target: /var/lib/polysia/data
      - type: bind
        source: ${POLYSIA_STATE_DIR:-/var/lib/polysia}/wallet-intelligence/reports
        target: /var/lib/polysia/reports/wallet-intelligence
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 512m
    cpus: 0.5
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "5"

  wallet-intelligence-shadow-portfolio:
    image: polysia:${POLYSIA_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        POLYSIA_BUILD_COMMIT: ${POLYSIA_IMAGE_TAG:-unknown}
    profiles:
      - wallet-intelligence
    container_name: polysia-shadow-portfolio-worker
    restart: "no"
    environment:
      APP_ENV: production
      LIVE_TRADING_ENABLED: "false"
      TRADING_MODE: DATA_ONLY
      POLYSIA_HOST_ID: ${POLYSIA_HOST_ID:-hetzner-finland-helsinki-01}
      POLYSIA_PROVIDER: ${POLYSIA_PROVIDER:-hetzner}
      POLYSIA_REGION: ${POLYSIA_REGION:-helsinki}
      POLYSIA_LATENCY_TELEMETRY_ENABLED: ${POLYSIA_LATENCY_TELEMETRY_ENABLED:-true}
      POLYSIA_LATENCY_PROBE_ENABLED: ${POLYSIA_LATENCY_PROBE_ENABLED:-true}
    command:
      - wallet-intelligence
      - portfolio-sync
      - --source
      - polycop
      - --database
      - /var/lib/polysia/data/wallet-intelligence.sqlite3
      - --health-report
      - /var/lib/polysia/reports/wallet-intelligence/continuous-shadow.json
      - --poll-interval-seconds
      - "${POLYSIA_CONTINUOUS_SHADOW_POLL_SECONDS:-60}"
      - --wallet-bankroll
      - "${POLYSIA_CONTINUOUS_SHADOW_WALLET_BANKROLL:-100}"
      - --follower-bankroll
      - "${POLYSIA_CONTINUOUS_SHADOW_FOLLOWER_BANKROLL:-1000}"
      - --maximum-event-notional
      - "${POLYSIA_CONTINUOUS_SHADOW_MAX_EVENT_NOTIONAL:-5}"
      - --wallet-maximum-exposure
      - "${POLYSIA_CONTINUOUS_SHADOW_WALLET_MAX_EXPOSURE:-100}"
      - --follower-maximum-exposure
      - "${POLYSIA_CONTINUOUS_SHADOW_FOLLOWER_MAX_EXPOSURE:-500}"
      - --follower-maximum-wallet-exposure
      - "${POLYSIA_CONTINUOUS_SHADOW_FOLLOWER_WALLET_MAX_EXPOSURE:-25}"
      - --follower-maximum-market-exposure
      - "${POLYSIA_CONTINUOUS_SHADOW_FOLLOWER_MARKET_MAX_EXPOSURE:-100}"
      - --follower-maximum-positions
      - "${POLYSIA_CONTINUOUS_SHADOW_FOLLOWER_MAX_POSITIONS:-100}"
      - --maximum-forward-delay-ms
      - "${POLYSIA_CONTINUOUS_SHADOW_MAX_DELAY_MS:-300000}"
      - --maximum-quote-age-ms
      - "${POLYSIA_CONTINUOUS_SHADOW_MAX_QUOTE_AGE_MS:-30000}"
      - --initial-lookback-minutes
      - "${POLYSIA_CONTINUOUS_SHADOW_INITIAL_LOOKBACK_MINUTES:-15}"
      - --overlap-seconds
      - "${POLYSIA_CONTINUOUS_SHADOW_OVERLAP_SECONDS:-30}"
      - --loop
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    volumes:
      - type: bind
        source: ${POLYSIA_STATE_DIR:-/var/lib/polysia}/wallet-intelligence/data
        target: /var/lib/polysia/data
      - type: bind
        source: ${POLYSIA_STATE_DIR:-/var/lib/polysia}/wallet-intelligence/reports
        target: /var/lib/polysia/reports/wallet-intelligence
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 96
    mem_limit: 768m
    cpus: 0.75
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "5"

  wallet-intelligence-handoff:
    image: polysia:${POLYSIA_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        POLYSIA_BUILD_COMMIT: ${POLYSIA_IMAGE_TAG:-unknown}
    profiles:
      - wallet-intelligence
    environment:
      APP_ENV: production
      LIVE_TRADING_ENABLED: "false"
      TRADING_MODE: DATA_ONLY
      POLYMARKET_LIVE_TOKEN_ALLOWLIST: ""
    command:
      - wallet-intelligence
      - runtime-bank
      - --source
      - polycop
      - --database
      - /var/lib/polysia/data/wallet-intelligence.sqlite3
      - --candidate-file
      - /var/lib/polysia/runtime/candidates.txt
      - --manifest-dir
      - /var/lib/polysia/runtime/candidate-banks
      - --minimum-simulated-events
      - "1"
      - --maximum-unknown-ratio
      - "0.50"
      - --maximum-historical-age-days
      - "8"
    user: "10001:10001"
    read_only: true
    network_mode: none
    tmpfs:
      - /tmp:size=32m,mode=1777
    volumes:
      - type: bind
        source: ${POLYSIA_STATE_DIR:-/var/lib/polysia}/wallet-intelligence/data
        target: /var/lib/polysia/data
        read_only: true
      - type: bind
        source: ${POLYSIA_STATE_DIR:-/var/lib/polysia}/runtime
        target: /var/lib/polysia/runtime
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 32
    mem_limit: 256m
    cpus: 0.25
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "5"

  copy-experiment:
    image: polysia:${POLYSIA_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        POLYSIA_BUILD_COMMIT: ${POLYSIA_IMAGE_TAG:-unknown}
    profiles:
      - live-experiment
    env_file:
      - path: ${POLYSIA_COPY_ENV_FILE:-/etc/polysia/tiny-live-copy.env}
        required: true
    environment:
      POLYSIA_COPY_SIGNAL_ARBITER_FULL_ENABLED: "false"
    entrypoint:
      - /bin/sh
      - -ec
    command:
      - |
        test "$${TRADING_MODE:-}" = LIVE
        test "$${LIVE_TRADING_ENABLED:-}" = true
        test -n "$${POLYSIA_COPY_AUTHORIZATION_ID:-}"
        test "$${POLYSIA_COPY_LIVE_ACK:-}" = "$${POLYSIA_COPY_AUTHORIZATION_ID}"
        test -n "$${POLYSIA_VERIFIED_CI_COMMIT:-}"
        test -n "$${POLYSIA_COPY_RUN_ID:-}"
        status_path="/var/lib/polysia/reports/$${POLYSIA_COPY_RUN_ID}/status.json"
        python -m polysia.cli live tiny-copy \
          --candidate-file /var/lib/polysia/runtime/candidates.txt \
          --output-dir "/var/lib/polysia/reports/$${POLYSIA_COPY_RUN_ID}" \
          --database /var/lib/polysia/data/polysia.sqlite3 \
          --run-id "$${POLYSIA_COPY_RUN_ID}" \
          --verified-ci-commit "$${POLYSIA_VERIFIED_CI_COMMIT}" \
          --authorization-id "$${POLYSIA_COPY_AUTHORIZATION_ID}" \
          --acknowledge "$${POLYSIA_COPY_LIVE_ACK}" \
          --submit &
        worker_pid=$$!
        trap 'kill -TERM "$${worker_pid}" 2>/dev/null || true' TERM INT
        (
          while kill -0 "$${worker_pid}" 2>/dev/null; do
            sleep 30
            if test -s "$${status_path}" &&
              ! python -c "import json,os,time; p='$${status_path}'; s=json.load(open(p)); assert s.get('state') in {'PREFLIGHT','BASELINING'} or time.time()-os.path.getmtime(p)<120"; then
              kill -TERM "$${worker_pid}" 2>/dev/null || true
              sleep 10
              kill -KILL "$${worker_pid}" 2>/dev/null || true
              exit
            fi
          done
        ) &
        watchdog_pid=$$!
        set +e
        wait "$${worker_pid}"
        worker_status=$$?
        kill "$${watchdog_pid}" 2>/dev/null || true
        wait "$${watchdog_pid}" 2>/dev/null || true
        exit "$${worker_status}"
    user: "10001:10001"
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    volumes:
      - type: bind
        source: ${POLYSIA_STATE_DIR:-/var/lib/polysia}
        target: /var/lib/polysia
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import os,time; p='/var/lib/polysia/reports/'+os.environ['POLYSIA_COPY_RUN_ID']+'/status.json'; assert os.path.getsize(p)>0 and time.time()-os.path.getmtime(p)<120"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s
    restart: "on-failure:3"
    stop_grace_period: 60s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 768m
    cpus: 1.0
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "5"
