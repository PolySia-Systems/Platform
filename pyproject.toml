[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "polysia"
version = "0.1.0"
description = "Professional prediction-market platform with a Polymarket adapter."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "polymarket-client==0.1.0b11",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "structlog>=24.1",
    "rich>=13.7",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "build==1.5.1",
    "cyclonedx-bom==7.3.0",
    "hypothesis==6.156.6",
    "mypy==2.1.0",
    "pip-audit==2.10.1",
    "pre-commit==4.6.1",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.15.20",
]

[project.scripts]
polysia = "polysia.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/polysia"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
warn_unused_configs = true
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["structlog.*"]
ignore_missing_imports = true
