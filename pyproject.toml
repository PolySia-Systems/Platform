[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[project]
name = "polysia"
version = "0.1.0"
description = "Professional prediction-market platform with a Polymarket adapter."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "polymarket-client==0.2.0",
    "pydantic>=2.13.4,<3",
    "pydantic-settings>=2.14.2,<3",
    "python-dotenv>=1.2.2,<2",
    "structlog>=26.1.0,<27",
    "rich>=15.0.0,<16",
    "typer>=0.27.0,<1",
]

[project.optional-dependencies]
dev = [
    "build==1.5.0",
    "cyclonedx-bom==7.3.1",
    "hypothesis==6.163.0",
    "mypy==2.3.0",
    "pip-audit==2.10.1",
    "pre-commit==4.6.1",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.0",
    "setuptools==84.0.0",
]

[project.scripts]
polysia = "polysia.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/polysia"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
warn_unused_configs = true
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["structlog.*"]
ignore_missing_imports = true
